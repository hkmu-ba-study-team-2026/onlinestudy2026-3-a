<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --hover-color: #1d4ed8;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 680px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 36px 32px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .header-section {
            border-bottom: 2px solid var(--bg-color);
            margin-bottom: 24px;
            padding-bottom: 16px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label.question-title {
            display: block;
            font-size: 0.96rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .question-title .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .question-title .optional-badge {
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 500;
            margin-left: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .option-card {
            position: relative;
        }

        .option-card input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-card label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 14px;
            background-color: #fafafa;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
            height: 100%;
            gap: 3px;
        }

        .option-card label span.sub-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .option-card label:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        .option-card input:checked + label {
            border-color: var(--accent-color);
            background-color: #eff6ff;
            color: var(--accent-color);
            font-weight: 700;
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .option-card input:checked + label span.sub-desc {
            color: #3b82f6;
        }

        .clear-choice-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.78rem;
            cursor: pointer;
            margin-top: 6px;
            padding: 2px 4px;
            text-decoration: underline;
            display: inline-block;
        }
        .clear-choice-btn:hover {
            color: #ef4444;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--hover-color);
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 20px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<script>
    // 清除第 3 题所有已勾选的设施
    function clearFacilityPreference() {
        document.querySelectorAll('input[name="hotel_facilities"]').forEach(el => el.checked = false);
    }

    // 支持第 5 题单选可取消选择（再次点击已选中的 radio 即可取消）
    let currentCheckedRadio = null;
    function handleRadioToggle(radio) {
        if (currentCheckedRadio === radio) {
            radio.checked = false;
            currentCheckedRadio = null;
        } else {
            currentCheckedRadio = radio;
        }
    }

    // 清除第 5 题选择
    function clearLocationPreference() {
        document.querySelectorAll('input[name="location_preference"]').forEach(el => el.checked = false);
        currentCheckedRadio = null;
    }

    function generate32DigitParticipantID() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const timestamp14 = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

        let random18 = '';
        for (let i = 0; i < 18; i++) {
            random18 += Math.floor(Math.random() * 10);
        }
        return timestamp14 + random18;
    }

    let currentParticipantID = localStorage.getItem("participantID");
    if (!currentParticipantID || currentParticipantID.length !== 32) {
        currentParticipantID = generate32DigitParticipantID();
        localStorage.setItem("participantID", currentParticipantID);
    }

    document.addEventListener("DOMContentLoaded", () => {
        try {
            if (typeof db !== 'undefined') {
                db.ref('participants/' + currentParticipantID).update({
                    participantID: currentParticipantID,
                    createdAt: new Date().toISOString()
                });
            }
        } catch(e) {
            console.log("Firebase sync skipped in offline mode.");
        }
    });

    // Firebase 原子计数递增 (+1)
    function getNextGroupingNumber() {
        return new Promise((resolve) => {
            if (typeof db === 'undefined') {
                let fallbackNum = parseInt(localStorage.getItem('local_grouping_num') || "0", 10);
                localStorage.setItem('local_grouping_num', fallbackNum + 1);
                resolve(fallbackNum);
                return;
            }

            const groupingRef = db.ref('grouping');
            groupingRef.transaction((currentValue) => {
                return (currentValue || 0) + 1;
            }, (error, committed, snapshot) => {
                if (error || !committed) {
                    console.warn("Transaction failed, using fallback:", error);
                    resolve(Math.floor(Math.random() * 100));
                } else {
                    resolve(snapshot.val() - 1);
                }
            });
        });
    }

    async function handleSubmit(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '正在分析偏好并分配模式...';

        const formData = new FormData(event.target);

        // 收集问卷数据
        const pricePref = formData.get("price_preference");
        const ratingPref = formData.get("rating_preference");
        const facilities = formData.getAll("hotel_facilities");
        const preferredRegion = formData.get("preferred_region");
        const locationPref = formData.get("location_preference") || "无特定偏好";

        const q6Response = formData.get("q6_friendly_courteous");
        const q7Response = formData.get("q7_polite_considerate");
        const q8Response = formData.get("q8_admit_mistakes_difficult");

        const surveyResponses = {
            price_preference: pricePref,
            rating_preference: ratingPref,
            hotel_facilities: facilities,
            preferred_region: preferredRegion,
            location_preference: locationPref,
            q6_friendly_courteous: q6Response,
            q7_polite_considerate: q7Response,
            q8_admit_mistakes_difficult: q8Response
        };

        // 获取分组编号及余数 (grouping % 4)
        const currentGroupNumber = await getNextGroupingNumber();
        const conditionModulo = currentGroupNumber % 4;

        let autonomyMode = "low";
        let recommendationMode = "traditional";

        if (conditionModulo === 0) {
            autonomyMode = "low";
            recommendationMode = "traditional";
        } else if (conditionModulo === 1) {
            autonomyMode = "low";
            recommendationMode = "ai";
        } else if (conditionModulo === 2) {
            autonomyMode = "high";
            recommendationMode = "traditional";
        } else if (conditionModulo === 3) {
            autonomyMode = "high";
            recommendationMode = "ai";
        }

        // 筛选所有有 "eco" 纪录的酒店备选
        const ecoHotels = (typeof hotelsData !== 'undefined' && hotelsData.length > 0)
            ? hotelsData.filter(h => h.eco && typeof h.eco === 'string' && h.eco.trim() !== "")
            : [];
        const randomEcoHotel = ecoHotels.length > 0
            ? ecoHotels[Math.floor(Math.random() * ecoHotels.length)]
            : (typeof hotelsData !== 'undefined' ? hotelsData[0] : { id: 1, name: "香港唯港荟酒店 (Hotel ICON)" });

        let recommendedHotelId = randomEcoHotel.id;
        let recommendedHotelName = randomEcoHotel.name;
        let aiNudgeText = "";

        if (recommendationMode === "ai") {
            try {
                const payload = {
                    products: ecoHotels,
                    preferences: surveyResponses
                };

                const response = await fetch("/api/recommend", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.recommendedHotelId) recommendedHotelId = data.recommendedHotelId;
                    if (data.recommendedHotelName) recommendedHotelName = data.recommendedHotelName;
                    aiNudgeText = data.recommendation || `为您精选平台今日主推特选住宿：${recommendedHotelName}，尽享轻奢设计与可持续发展理念。`;
                } else {
                    throw new Error("AI service non-200");
                }
            } catch (err) {
                console.warn("AI recommendation failed, using fallback:", err);
                recommendedHotelId = randomEcoHotel.id;
                recommendedHotelName = randomEcoHotel.name;
                aiNudgeText = `为您精选平台今日主推特选住宿：${randomEcoHotel.name}，尽享轻奢设计与可持续发展理念。`;
            }
        } else {
            // Traditional 模式：在所有有 "eco" 纪录的酒店中随机选一间做推荐
            recommendedHotelId = randomEcoHotel.id;
            recommendedHotelName = randomEcoHotel.name;
            aiNudgeText = `为您精选平台今日主推特选住宿：${randomEcoHotel.name}，尽享轻奢设计与可持续发展理念。`;
        }

        // 保存状态至 localStorage
        localStorage.setItem("grouping_number", currentGroupNumber);
        localStorage.setItem("condition_modulo", conditionModulo);
        localStorage.setItem("autonomy_mode", autonomyMode);
        localStorage.setItem("recommendation_mode", recommendationMode);
        localStorage.setItem("recommended_hotel_id", recommendedHotelId);
        localStorage.setItem("recommended_hotel_name", recommendedHotelName);
        localStorage.setItem("ai_nudge_text", aiNudgeText);
        localStorage.setItem("user_preferences", JSON.stringify(surveyResponses));

        // 写入 Firebase 问卷数据节点
        const firebaseData = {
            participantID: currentParticipantID,
            groupingNumber: currentGroupNumber,
            conditionModulo: conditionModulo,
            autonomyMode: autonomyMode,
            recommendationMode: recommendationMode,
            recommendedHotelId: recommendedHotelId,
            recommendedHotelName: recommendedHotelName,
            aiNudgeText: aiNudgeText,
            submittedAt: new Date().toISOString(),
            responses: surveyResponses
        };

        try {
            if (typeof db !== 'undefined') {
                await db.ref('survey_responses/' + currentParticipantID).set(firebaseData);
            }
        } catch (dbError) {
            console.error('保存至 Firebase 失败:', dbError);
        }

        // 跳转并带上实验组态参数
        window.location.href = `booking_page.html?recId=${recommendedHotelId}&mode=${recommendationMode}&autonomy=${autonomyMode}&group=${currentGroupNumber}`;
    }
</script>
</body>
</html>
