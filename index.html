<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店预订前测问卷</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --hover-color: #1d4ed8;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 680px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 36px 32px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .header-section {
            border-bottom: 2px solid var(--bg-color);
            margin-bottom: 24px;
            padding-bottom: 16px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label.question-title {
            display: block;
            font-size: 0.96rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .question-title .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .option-card {
            position: relative;
        }

        .option-card input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-card label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 14px;
            background-color: #fafafa;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
        }

        .option-card label:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        .option-card input:checked + label {
            border-color: var(--accent-color);
            background-color: #eff6ff;
            color: var(--accent-color);
            font-weight: 700;
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--hover-color);
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 20px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCUVqZIgK8YKNAQkZLyA7mHq0qHbPE4RQk",
        authDomain: "online-study-3a.firebaseapp.com",
        databaseURL: "https://online-study-3a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "online-study-3a",
        storageBucket: "online-study-3a.firebasestorage.app",
        messagingSenderId: "641152608367",
        appId: "1:641152608367:web:c6a1a0920d1988d156c59a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
</script>

<body>

<div class="container">
    <div class="header-section">
        <h1 class="header-title">请继续以下问卷内容</h1>
    </div>

    <form id="surveyForm" onsubmit="handleSubmit(event)">

        <!-- 问题 1: 订房注重倾向 -->
        <div class="form-group">
            <label class="question-title">1. 你订酒店时一般比较注重：<span class="required">*</span></label>
            <div class="options-grid">
                <div class="option-card">
                    <input type="radio" id="focus_cheap" name="hotel_focus" value="价格便宜" required>
                    <label for="focus_cheap">价格便宜</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="focus_value" name="hotel_focus" value="性价比高" required>
                    <label for="focus_value">性价比高</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="focus_quality" name="hotel_focus" value="品质上乘" required>
                    <label for="focus_quality">品质上乘</label>
                </div>
            </div>
        </div>

        <!-- 问题 2: 设施偏好 (客房及酒店配套设施，可多选) -->
        <div class="form-group">
            <label class="question-title">2. 你重视酒店要有以下设施吗？（可多选）</label>
            <div class="options-grid">
                <div class="option-card">
                    <input type="checkbox" id="facility_breakfast" name="hotel_facilities" value="含免费丰盛早餐">
                    <label for="facility_breakfast">含免费丰盛早餐</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_bath" name="hotel_facilities" value="配备独立卫浴/浴缸">
                    <label for="facility_bath">配备独立卫浴/浴缸</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_pool" name="hotel_facilities" value="室外泳池/景观无边际池">
                    <label for="facility_pool">室外泳池/无边际池</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_cancel" name="hotel_facilities" value="限时免费取消政策">
                    <label for="facility_cancel">限时免费取消政策</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_gym" name="hotel_facilities" value="健身中心/水疗SPA">
                    <label for="facility_gym">健身中心/水疗SPA</label>
                </div>
            </div>
        </div>

        <!-- 问题 3: 偏好地区 -->
        <div class="form-group">
            <label class="question-title">3. 你喜欢住在哪个地区？<span class="required">*</span></label>
            <div class="options-grid">
                <div class="option-card">
                    <input type="radio" id="region_hk" name="preferred_region" value="港岛" required>
                    <label for="region_hk">港岛</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_kl" name="preferred_region" value="九龙" required>
                    <label for="region_kl">九龙</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_nt" name="preferred_region" value="新界" required>
                    <label for="region_nt">新界</label>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
            提交并进入酒店预订平台
        </button>
    </form>
</div>

<script>
    // 生成 32 位个人 ID: 14位时间戳 (YYYYMMDDHHmmss) + 18位随机数
    function generate32DigitParticipantID() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const timestamp14 = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

        let random18 = '';
        for (let i = 0; i < 18; i++) {
            random18 += Math.floor(Math.random() * 10);
        }
        return timestamp14 + random18;
    }

    // 初始化并持久化 Participant ID (不在页面显示，但在底层保存供后续实验使用)
    let currentParticipantID = localStorage.getItem("participantID");
    if (!currentParticipantID || currentParticipantID.length !== 32) {
        currentParticipantID = generate32DigitParticipantID();
        localStorage.setItem("participantID", currentParticipantID);
    }

    document.addEventListener("DOMContentLoaded", () => {
        // 同步登记此 ID 至 Firebase Realtime Database
        try {
            if (typeof db !== 'undefined') {
                db.ref('participants/' + currentParticipantID).update({
                    participantID: currentParticipantID,
                    createdAt: new Date().toISOString()
                });
            }
        } catch(e) {
            console.log("Firebase sync skipped in offline mode.");
        }
    });

    async function handleSubmit(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '正在保存问卷并跳转...';

        const formData = new FormData(event.target);

        // 收集 3 个问题的答案
        const hotelFocus = formData.get("hotel_focus");
        const facilities = formData.getAll("hotel_facilities");
        const preferredRegion = formData.get("preferred_region");

        const surveyResponses = {
            hotel_focus: hotelFocus,
            hotel_facilities: facilities,
            preferred_region: preferredRegion
        };

        const firebaseData = {
            participantID: currentParticipantID,
            submittedAt: new Date().toLocaleString(),
            responses: surveyResponses
        };

        try {
            if (typeof db !== 'undefined') {
                await db.ref('survey_responses/' + currentParticipantID).set(firebaseData);
            }
        } catch (dbError) {
            console.error('保存至 Firebase 失败:', dbError);
        }

        // 跳转至酒店预订模拟平台
        window.location.href = 'booking_page.html';
    }
</script>
</body>
</html>
