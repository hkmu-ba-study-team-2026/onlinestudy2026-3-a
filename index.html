<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="doc_title">TripStay 酒店預訂前測問卷</title>
    <!-- 引入酒店數據庫 -->
    <script src="hotels_data.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --hover-color: #1d4ed8;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 24px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 720px;
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 36px 32px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .header-section {
            border-bottom: 2px solid var(--bg-color);
            margin-bottom: 26px;
            padding-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .lang-select-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-select-box select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .lang-select-box select:focus {
            border-color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label.question-title {
            display: block;
            font-size: 0.96rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .question-title .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .question-title .optional-badge {
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 500;
            margin-left: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .option-card {
            position: relative;
        }

        .option-card input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-card label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 14px;
            background-color: #fafafa;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
            height: 100%;
            gap: 3px;
        }

        .option-card label:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        .option-card input:checked + label {
            border-color: var(--accent-color);
            background-color: #eff6ff;
            color: var(--accent-color);
            font-weight: 700;
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .clear-choice-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.78rem;
            cursor: pointer;
            margin-top: 6px;
            padding: 2px 4px;
            text-decoration: underline;
            display: inline-block;
        }
        .clear-choice-btn:hover {
            color: #ef4444;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--hover-color);
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 20px 18px;
            }
            .header-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header-section">
        <h1 class="header-title" data-i18n="header_title">請繼續以下問卷內容</h1>
        <div class="lang-select-box">
            <span style="font-size:0.9rem;">🌐</span>
            <select id="langSwitcher" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="zh-TW">繁體中文</option>
                <option value="zh-CN">简体中文</option>
            </select>
        </div>
    </div>

    <form id="surveyForm" onsubmit="handleSubmit(event)">

        <!-- 問題 1: 出行預算風格 (經濟、舒適、高檔、奢華) -->
        <div class="form-group">
            <label class="question-title">
                <span data-i18n="q1_title">1. 本次旅程中，您偏好哪種住宿安排與預算風格？</span>
                <span class="required">*</span>
            </label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="price_economy" name="price_preference" value="经济" required>
                    <label for="price_economy"><span data-i18n="q1_opt_economy">經濟</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="price_refined" name="price_preference" value="精致" required>
                    <label for="price_refined"><span data-i18n="q1_opt_refined">舒適</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="price_upscale" name="price_preference" value="高级" required>
                    <label for="price_upscale"><span data-i18n="q1_opt_upscale">高檔</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="price_luxury" name="price_preference" value="奢侈" required>
                    <label for="price_luxury"><span data-i18n="q1_opt_luxury">奢華</span></label>
                </div>
            </div>
        </div>

        <!-- 問題 2: 住客口碑標準 -->
        <div class="form-group">
            <label class="question-title">
                <span data-i18n="q2_title">2. 翻閱其他住客的體驗評價時，您通常的標準是？</span>
                <span class="required">*</span>
            </label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="rating_80" name="rating_preference" value="8.0分以上" required>
                    <label for="rating_80"><span data-i18n="q2_opt_80">大致好評</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="rating_85" name="rating_preference" value="8.5分以上" required>
                    <label for="rating_85"><span data-i18n="q2_opt_85">多數肯定</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="rating_90" name="rating_preference" value="9.0分以上" required>
                    <label for="rating_90"><span data-i18n="q2_opt_90">廣泛盛讚</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="rating_95" name="rating_preference" value="9.5分顶尖" required>
                    <label for="rating_95"><span data-i18n="q2_opt_95">近乎完美</span></label>
                </div>
            </div>
        </div>

        <!-- 問題 3: 設施偏好 (多選，可選填) -->
        <div class="form-group">
            <label class="question-title">
                <span data-i18n="q3_title">3. 你重視酒店要有以下設施嗎？</span>
                <span class="optional-badge" data-i18n="q3_optional_badge">(選填，可不選或選多項)</span>
            </label>
            <div class="options-grid">
                <div class="option-card">
                    <input type="checkbox" id="facility_breakfast" name="hotel_facilities" value="含免费丰盛早餐">
                    <label for="facility_breakfast" data-i18n="q3_fac_breakfast">含免費早餐</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_bath" name="hotel_facilities" value="配备独立卫浴/浴缸">
                    <label for="facility_bath" data-i18n="q3_fac_bath">配備浴缸</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_pool" name="hotel_facilities" value="室外泳池/景观无边际池">
                    <label for="facility_pool" data-i18n="q3_fac_pool">室外泳池</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_cancel" name="hotel_facilities" value="限时免费取消政策">
                    <label for="facility_cancel" data-i18n="q3_fac_cancel">限時免費取消政策</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_gym" name="hotel_facilities" value="健身中心/水疗SPA">
                    <label for="facility_gym" data-i18n="q3_fac_gym">健身中心/水療SPA</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_shuttle" name="hotel_facilities" value="提供穿梭巴士/机场接送">
                    <label for="facility_shuttle" data-i18n="q3_fac_shuttle">穿梭巴士/機場接送</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_parking" name="hotel_facilities" value="附设免费住客泊车位">
                    <label for="facility_parking" data-i18n="q3_fac_parking">免費住客泊車位</label>
                </div>
            </div>
            <div style="text-align: right;">
                <button type="button" class="clear-choice-btn" onclick="clearFacilityPreference()" data-i18n="q3_clear_btn">清除第 3 題選擇 (保持不選)</button>
            </div>
        </div>

        <!-- 問題 4: 偏好地區 (10大區域) -->
        <div class="form-group">
            <label class="question-title">
                <span data-i18n="q4_title">4. 你喜歡住在哪個區域？</span>
                <span class="required">*</span>
            </label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="region_tst" name="preferred_region" value="尖沙咀" required>
                    <label for="region_tst" data-i18n="q4_reg_tst">尖沙咀</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_mk" name="preferred_region" value="旺角" required>
                    <label for="region_mk" data-i18n="q4_reg_mk">旺角</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_central" name="preferred_region" value="中环" required>
                    <label for="region_central" data-i18n="q4_reg_central">中環</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_tw" name="preferred_region" value="荃湾" required>
                    <label for="region_tw" data-i18n="q4_reg_tw">荃灣</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_disney" name="preferred_region" value="香港迪士尼乐园" required>
                    <label for="region_disney" data-i18n="q4_reg_disney">香港迪士尼樂園</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_st" name="preferred_region" value="沙田" required>
                    <label for="region_st" data-i18n="q4_reg_st">沙田</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_np" name="preferred_region" value="北角" required>
                    <label for="region_np" data-i18n="q4_reg_np">北角</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_cwb" name="preferred_region" value="铜锣湾" required>
                    <label for="region_cwb" data-i18n="q4_reg_cwb">銅鑼灣</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_vic" name="preferred_region" value="维多利亚港" required>
                    <label for="region_vic" data-i18n="q4_reg_vic">維多利亞港</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_kt" name="preferred_region" value="启德体育园" required>
                    <label for="region_kt" data-i18n="q4_reg_kt">啟德體育園</label>
                </div>
            </div>
        </div>

        <!-- 問題 5: 地點特色偏好 (單選，支援再次點擊取消) -->
        <div class="form-group">
            <label class="question-title">
                <span data-i18n="q5_title">5. 針對酒店周邊的地理位置，您是否有特定的偏好？</span>
                <span class="optional-badge" data-i18n="q5_optional_badge">(選填，可不選或選 1 項)</span>
            </label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="loc_transport" name="location_preference" value="机场/高铁站" onclick="handleRadioToggle(this)">
                    <label for="loc_transport"><span data-i18n="q5_tag_transport">機場/高鐵站</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="loc_metro" name="location_preference" value="地铁站" onclick="handleRadioToggle(this)">
                    <label for="loc_metro"><span data-i18n="q5_tag_metro">地鐵站</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="loc_business" name="location_preference" value="商业区" onclick="handleRadioToggle(this)">
                    <label for="loc_business"><span data-i18n="q5_tag_business">商業區</span></label>
                </div>
                <div class="option-card">
                    <input type="radio" id="loc_venue" name="location_preference" value="演出场馆" onclick="handleRadioToggle(this)">
                    <label for="loc_venue"><span data-i18n="q5_tag_venue">演出場館</span></label>
                </div>
            </div>
            <div style="text-align: right;">
                <button type="button" class="clear-choice-btn" onclick="clearLocationPreference()" data-i18n="q5_clear_btn">清除第 5 題選擇 (保持不選)</button>
            </div>
        </div>

        <!-- 問題 6: 性格態度量表 (7點李克特量表) -->
        <div class="form-group">
            <label class="question-title">
                <span data-i18n="q6_title">6. 我總是對他人保持友善與謙遜有禮。</span>
                <span class="required">*</span>
            </label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="q6_1" name="q6_friendly_courteous" value="非常不同意" required>
                    <label for="q6_1" data-i18n="likert_7_1">非常不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q6_2" name="q6_friendly_courteous" value="不同意" required>
                    <label for="q6_2" data-i18n="likert_7_2">不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q6_3" name="q6_friendly_courteous" value="有点不同意" required>
                    <label for="q6_3" data-i18n="likert_7_3">有點不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q6_4" name="q6_friendly_courteous" value="中立" required>
                    <label for="q6_4" data-i18n="likert_7_4">中立</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q6_5" name="q6_friendly_courteous" value="有点同意" required>
                    <label for="q6_5" data-i18n="likert_7_5">有點同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q6_6" name="q6_friendly_courteous" value="同意" required>
                    <label for="q6_6" data-i18n="likert_7_6">同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q6_7" name="q6_friendly_courteous" value="非常同意" required>
                    <label for="q6_7" data-i18n="likert_7_7">非常同意</label>
                </div>
            </div>
        </div>

        <!-- 問題 7: 性格態度量表 (7點李克特量表) -->
        <div class="form-group">
            <label class="question-title">
                <span data-i18n="q7_title">7. 我始終對人禮貌，且處處為他人著想。</span>
                <span class="required">*</span>
            </label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="q7_1" name="q7_polite_considerate" value="非常不同意" required>
                    <label for="q7_1" data-i18n="likert_7_1">非常不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q7_2" name="q7_polite_considerate" value="不同意" required>
                    <label for="q7_2" data-i18n="likert_7_2">不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q7_3" name="q7_polite_considerate" value="有点不同意" required>
                    <label for="q7_3" data-i18n="likert_7_3">有點不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q7_4" name="q7_polite_considerate" value="中立" required>
                    <label for="q7_4" data-i18n="likert_7_4">中立</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q7_5" name="q7_polite_considerate" value="有点同意" required>
                    <label for="q7_5" data-i18n="likert_7_5">有點同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q7_6" name="q7_polite_considerate" value="同意" required>
                    <label for="q7_6" data-i18n="likert_7_6">同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q7_7" name="q7_polite_considerate" value="非常同意" required>
                    <label for="q7_7" data-i18n="likert_7_7">非常同意</label>
                </div>
            </div>
        </div>

        <!-- 問題 8: 性格態度量表 (7點李克特量表) -->
        <div class="form-group">
            <label class="question-title">
                <span data-i18n="q8_title">8. 對我來說，公開向他人承認自己的錯誤是很困難的。</span>
                <span class="required">*</span>
            </label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="q8_1" name="q8_admit_mistakes_difficult" value="非常不同意" required>
                    <label for="q8_1" data-i18n="likert_7_1">非常不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q8_2" name="q8_admit_mistakes_difficult" value="不同意" required>
                    <label for="q8_2" data-i18n="likert_7_2">不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q8_3" name="q8_admit_mistakes_difficult" value="有点不同意" required>
                    <label for="q8_3" data-i18n="likert_7_3">有點不同意</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q8_4" name="q8_admit_mistakes_difficult" value="中立" required>
                    <label for="q8_4" data-i18n="likert_7_4">中立</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="q8_5" name="q8_admit_mistakes_difficult" value="有点同意" required>

    let currentLanguage = localStorage.getItem("tripstay_lang") || "zh-TW";

    function changeLanguage(lang) {
        if (!SURVEY_I18N[lang]) return;
        currentLanguage = lang;
        localStorage.setItem("tripstay_lang", lang);
        applySurveyTranslations();
    }

    function applySurveyTranslations() {
        const dict = SURVEY_I18N[currentLanguage] || SURVEY_I18N["zh-TW"];
        document.documentElement.lang = currentLanguage;

        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (dict[key]) {
                el.innerText = dict[key];
            }
        });

        const langSwitcher = document.getElementById("langSwitcher");
        if (langSwitcher) langSwitcher.value = currentLanguage;
    }

    // -------------------------------------------------------------------------
    // 2. 問卷交互與時間戳記記錄
    // -------------------------------------------------------------------------
    // 記錄受試者初次進入問卷頁面的精確時間戳
    const surveyEntryTime = new Date().toISOString();

    // 清除第 3 題所有已勾選的設施
    function clearFacilityPreference() {
        document.querySelectorAll('input[name="hotel_facilities"]').forEach(el => el.checked = false);
    }

    // 支援第 5 題單選可取消反選 (再次點擊已選中的 radio 即可取消)
    let currentCheckedRadio = null;
    function handleRadioToggle(radio) {
        if (currentCheckedRadio === radio) {
            radio.checked = false;
            currentCheckedRadio = null;
        } else {
            currentCheckedRadio = radio;
        }
    }

    // 清除第 5 題選擇
    function clearLocationPreference() {
        document.querySelectorAll('input[name="location_preference"]').forEach(el => el.checked = false);
        currentCheckedRadio = null;
    }

    function generate32DigitParticipantID() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const timestamp14 = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

        let random18 = '';
        for (let i = 0; i < 18; i++) {
            random18 += Math.floor(Math.random() * 10);
        }
        return timestamp14 + random18;
    }

    let currentParticipantID = localStorage.getItem("participantID");
    if (!currentParticipantID || currentParticipantID.length !== 32) {
        currentParticipantID = generate32DigitParticipantID();
        localStorage.setItem("participantID", currentParticipantID);
    }

    document.addEventListener("DOMContentLoaded", () => {
        applySurveyTranslations();

        try {
            if (typeof db !== 'undefined') {
                db.ref('participants/' + currentParticipantID).update({
                    participantID: currentParticipantID,
                    createdAt: surveyEntryTime
                });
            }
        } catch(e) {
            console.log("Firebase sync skipped in offline mode.");
        }
    });

    // Firebase 原子計數遞增 (+1)
    function getNextGroupingNumber() {
        return new Promise((resolve) => {
            if (typeof db === 'undefined') {
                let fallbackNum = parseInt(localStorage.getItem('local_grouping_num') || "0", 10);
                localStorage.setItem('local_grouping_num', fallbackNum + 1);
                resolve(fallbackNum);
                return;
            }

            const groupingRef = db.ref('grouping');
            groupingRef.transaction((currentValue) => {
                return (currentValue || 0) + 1;
            }, (error, committed, snapshot) => {
                if (error || !committed) {
                    console.warn("Transaction failed, using fallback:", error);
                    resolve(Math.floor(Math.random() * 100));
                } else {
                    resolve(snapshot.val() - 1);
                }
            });
        });
    }

    // -------------------------------------------------------------------------
    // 3. 表單提交與兩文三語實驗干預指派
    // -------------------------------------------------------------------------
    async function handleSubmit(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        const dict = SURVEY_I18N[currentLanguage] || SURVEY_I18N["zh-TW"];
        submitBtn.textContent = dict["submitting_text"] || '正在分析偏好並分配模式...';

        const surveySubmitTime = new Date().toISOString();
        const formData = new FormData(event.target);

        // 收集問卷數據 (維持標準統一值，確保與後台統計及 export_tool 嚴格對齊)
        const pricePref = formData.get("price_preference");
        const ratingPref = formData.get("rating_preference");
        const facilities = formData.getAll("hotel_facilities");
        const preferredRegion = formData.get("preferred_region");
        const locationPref = formData.get("location_preference") || "无特定偏好";

        const q6Response = formData.get("q6_friendly_courteous");
        const q7Response = formData.get("q7_polite_considerate");
        const q8Response = formData.get("q8_admit_mistakes_difficult");

        const surveyResponses = {
            price_preference: pricePref,
            rating_preference: ratingPref,
            hotel_facilities: facilities,
            preferred_region: preferredRegion,
            location_preference: locationPref,
            q6_friendly_courteous: q6Response,
            q7_polite_considerate: q7Response,
            q8_admit_mistakes_difficult: q8Response
        };

        // 獲取分組編號及餘數 (grouping % 4)
        const currentGroupNumber = await getNextGroupingNumber();
        const conditionModulo = currentGroupNumber % 4;

        let autonomyMode = "low";
        let recommendationMode = "traditional";

        if (conditionModulo === 0) {
            autonomyMode = "low";
            recommendationMode = "traditional";
        } else if (conditionModulo === 1) {
            autonomyMode = "low";
            recommendationMode = "ai";
        } else if (conditionModulo === 2) {
            autonomyMode = "high";
            recommendationMode = "traditional";
        } else if (conditionModulo === 3) {
            autonomyMode = "high";
            recommendationMode = "ai";
        }

        // 篩選所有具有 "eco" 環保紀錄的酒店備選
        const ecoHotels = (typeof hotelsData !== 'undefined' && hotelsData.length > 0)
            ? hotelsData.filter(h => h.eco && typeof h.eco === 'string' && h.eco.trim() !== "")
            : [];
        const randomEcoHotel = ecoHotels.length > 0
            ? ecoHotels[Math.floor(Math.random() * ecoHotels.length)]
            : (typeof hotelsData !== 'undefined' ? hotelsData[0] : { id: 1, name: "香港唯港荟酒店 (Hotel ICON)" });

        // 結構化三語推薦物件 (預設傳統推薦)
        const nameTwDefault = (randomEcoHotel.i18n && randomEcoHotel.i18n["zh-TW"] && randomEcoHotel.i18n["zh-TW"].name) || randomEcoHotel.name;
        const nameCnDefault = (randomEcoHotel.i18n && randomEcoHotel.i18n["zh-CN"] && randomEcoHotel.i18n["zh-CN"].name) || randomEcoHotel.name;
        const nameEnDefault = randomEcoHotel.enName || (randomEcoHotel.i18n && randomEcoHotel.i18n["en"] && randomEcoHotel.i18n["en"].name) || randomEcoHotel.name;

        let recommendedHotelId = randomEcoHotel.id;
        let recommendedHotelNameObj = {
            "zh-TW": nameTwDefault,
            "zh-CN": nameCnDefault,
            "en": nameEnDefault
        };
        let aiNudgeTextObj = {
            "zh-TW": `為您精選平台今日主推特選住宿：${nameTwDefault}，盡享輕奢設計與可持續發展理念。`,
            "zh-CN": `为您精选平台今日主推特选住宿：${nameCnDefault}，尽享轻奢设计与可持续发展理念。`,
            "en": `Featured top pick for your stay: ${nameEnDefault}, combining premier comfort with certified eco-friendly sustainability.`
        };

        if (recommendationMode === "ai") {
            try {
                const payload = {
                    products: ecoHotels,
                    preferences: surveyResponses
                };

                const response = await fetch("/api/recommend", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.recommendedHotelId) recommendedHotelId = data.recommendedHotelId;

                    if (data.recommendedHotelName && typeof data.recommendedHotelName === "object") {
                        recommendedHotelNameObj = data.recommendedHotelName;
                    } else if (data.recommendedHotelName) {
                        recommendedHotelNameObj = {
                            "zh-TW": data.recommendedHotelName,
                            "zh-CN": data.recommendedHotelName,
                            "en": data.recommendedHotelName
                        };
                    }

                    if (data.recommendation && typeof data.recommendation === "object") {
                        aiNudgeTextObj = data.recommendation;
                    } else if (data.recommendation) {
                        aiNudgeTextObj = {
                            "zh-TW": data.recommendation,
                            "zh-CN": data.recommendation,
                            "en": data.recommendation
                        };
                    }
                } else {
                    throw new Error("AI recommendation non-200");
                }
            } catch (err) {
                console.warn("AI recommendation failed, using multilingual fallback:", err);
            }
        }

        // 當前語言的 Nudge 文字
        const activeHotelName = recommendedHotelNameObj[currentLanguage] || recommendedHotelNameObj["zh-TW"] || recommendedHotelNameObj["zh-CN"];
        const activeNudgeText = aiNudgeTextObj[currentLanguage] || aiNudgeTextObj["zh-TW"] || aiNudgeTextObj["zh-CN"];

        // 保存狀態至 localStorage
        localStorage.setItem("grouping_number", currentGroupNumber);
        localStorage.setItem("condition_modulo", conditionModulo);
        localStorage.setItem("autonomy_mode", autonomyMode);
        localStorage.setItem("recommendation_mode", recommendationMode);
        localStorage.setItem("recommended_hotel_id", recommendedHotelId);
        localStorage.setItem("recommended_hotel_name", activeHotelName);
        localStorage.setItem("recommended_hotel_name_multilingual", JSON.stringify(recommendedHotelNameObj));
        localStorage.setItem("ai_nudge_text", activeNudgeText);
        localStorage.setItem("ai_nudge_text_multilingual", JSON.stringify(aiNudgeTextObj));
        localStorage.setItem("survey_entry_time", surveyEntryTime);
        localStorage.setItem("user_preferences", JSON.stringify(surveyResponses));

        // 寫入 Firebase 問卷數據節點 (包含完整的兩文三語物件、entryAt 與 submittedAt)
        const firebaseData = {
            participantID: currentParticipantID,
            groupingNumber: currentGroupNumber,
            conditionModulo: conditionModulo,
            autonomyMode: autonomyMode,
            recommendationMode: recommendationMode,
            recommendedHotelId: recommendedHotelId,
            recommendedHotelName: recommendedHotelNameObj,
            aiNudgeText: aiNudgeTextObj,
            entryAt: surveyEntryTime,
            submittedAt: surveySubmitTime,
            responses: surveyResponses
        };

        try {
            if (typeof db !== 'undefined') {
                await db.ref('survey_responses/' + currentParticipantID).set(firebaseData);
            }
        } catch (dbError) {
            console.error('保存至 Firebase 失敗:', dbError);
        }

        // 跳轉並帶上實驗組態與當前語言參數
        window.location.href = `booking_page.html?recId=${recommendedHotelId}&mode=${recommendationMode}&autonomy=${autonomyMode}&group=${currentGroupNumber}&lang=${currentLanguage}`;
    }
