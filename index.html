<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒店预订前测问卷</title>
    <!-- 引入酒店数据集供候选用 -->
    <script src="hotels_data.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --hover-color: #1d4ed8;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 680px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 36px 32px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .header-section {
            border-bottom: 2px solid var(--bg-color);
            margin-bottom: 24px;
            padding-bottom: 16px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label.question-title {
            display: block;
            font-size: 0.96rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .question-title .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .question-title .optional-badge {
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 500;
            margin-left: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .option-card {
            position: relative;
        }

        .option-card input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-card label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 14px;
            background-color: #fafafa;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
            height: 100%;
            gap: 3px;
        }

        .option-card label span.sub-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .option-card label:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        .option-card input:checked + label {
            border-color: var(--accent-color);
            background-color: #eff6ff;
            color: var(--accent-color);
            font-weight: 700;
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .option-card input:checked + label span.sub-desc {
            color: #3b82f6;
        }

        .clear-choice-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.78rem;
            cursor: pointer;
            margin-top: 6px;
            padding: 2px 4px;
            text-decoration: underline;
            display: inline-block;
        }
        .clear-choice-btn:hover {
            color: #ef4444;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--hover-color);
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 20px;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCUVqZIgK8YKNAQkZLyA7mHq0qHbPE4RQk",
        authDomain: "online-study-3a.firebaseapp.com",
        databaseURL: "https://online-study-3a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "online-study-3a",
        storageBucket: "online-study-3a.firebasestorage.app",
        messagingSenderId: "641152608367",
        appId: "1:641152608367:web:c6a1a0920d1988d156c59a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
</script>

<body>

<div class="container">
    <div class="header-section">
        <h1 class="header-title">请继续以下问卷内容</h1>
    </div>

    <form id="surveyForm" onsubmit="handleSubmit(event)">

        <!-- 问题 1: 出行预算取向 (四个选项：经济、精致、高级、奢侈) -->
        <div class="form-group">
            <label class="question-title">1. 本次旅程中，您偏好哪种住宿安排与预算风格？<span class="required">*</span></label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="price_economy" name="price_preference" value="经济" required>
                    <label for="price_economy">
                        <span style="font-size: 1rem; font-weight: 800;">经济</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="price_refined" name="price_preference" value="精致" required>
                    <label for="price_refined">
                        <span style="font-size: 1rem; font-weight: 800;">精致</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="price_upscale" name="price_preference" value="高级" required>
                    <label for="price_upscale">
                        <span style="font-size: 1rem; font-weight: 800;">高级</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="price_luxury" name="price_preference" value="奢侈" required>
                    <label for="price_luxury">
                        <span style="font-size: 1rem; font-weight: 800;">奢侈</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 问题 2: 住客口碑依赖度 (原第3题顺延) -->
        <div class="form-group">
            <label class="question-title">2. 翻阅其他住客的体验评价时，您通常的标准是？<span class="required">*</span></label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="rating_80" name="rating_preference" value="8.0分以上" required>
                    <label for="rating_80">
                        <span>大致好评</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="rating_85" name="rating_preference" value="8.5分以上" required>
                    <label for="rating_85">
                        <span>多数肯定</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="rating_90" name="rating_preference" value="9.0分以上" required>
                    <label for="rating_90">
                        <span>广泛盛赞</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="rating_95" name="rating_preference" value="9.5分顶尖" required>
                    <label for="rating_95">
                        <span>近乎完美</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 问题 3: 设施偏好 (原第4题顺延，可多选) -->
        <div class="form-group">
            <label class="question-title">3. 你重视酒店要有以下设施吗？（可多选）</label>
            <div class="options-grid">
                <div class="option-card">
                    <input type="checkbox" id="facility_breakfast" name="hotel_facilities" value="含免费丰盛早餐">
                    <label for="facility_breakfast">含免费丰盛早餐</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_bath" name="hotel_facilities" value="配备独立卫浴/浴缸">
                    <label for="facility_bath">配备独立卫浴/浴缸</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_pool" name="hotel_facilities" value="室外泳池/景观无边际池">
                    <label for="facility_pool">室外泳池/无边际池</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_cancel" name="hotel_facilities" value="限时免费取消政策">
                    <label for="facility_cancel">限时免费取消政策</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_gym" name="hotel_facilities" value="健身中心/水疗SPA">
                    <label for="facility_gym">健身中心/水疗SPA</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_shuttle" name="hotel_facilities" value="提供穿梭巴士/机场接送">
                    <label for="facility_shuttle">穿梭巴士/机场接送</label>
                </div>
                <div class="option-card">
                    <input type="checkbox" id="facility_parking" name="hotel_facilities" value="附设免费住客泊车位">
                    <label for="facility_parking">免费住客泊车位</label>
                </div>
            </div>
        </div>

        <!-- 问题 4: 偏好地区 (原第5题顺延) -->
        <div class="form-group">
            <label class="question-title">4. 你喜欢住在哪个行政区域？<span class="required">*</span></label>
            <div class="options-grid">
                <div class="option-card">
                    <input type="radio" id="region_hk" name="preferred_region" value="港岛" required>
                    <label for="region_hk">港岛 (Hong Kong Island)</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_kl" name="preferred_region" value="九龙" required>
                    <label for="region_kl">九龙 (Kowloon)</label>
                </div>
                <div class="option-card">
                    <input type="radio" id="region_nt" name="preferred_region" value="新界" required>
                    <label for="region_nt">新界 (New Territories)</label>
                </div>
            </div>
        </div>

        <!-- 问题 5: 地点特色偏好 (新增：单选或可不选) -->
        <div class="form-group">
            <label class="question-title">
                5. 针对酒店周边的地理位置，您是否有特定的偏好？
                <span class="optional-badge">(选填，可不选或选 1 项)</span>
            </label>
            <div class="options-grid" style="grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));">
                <div class="option-card">
                    <input type="radio" id="loc_transport" name="location_preference" value="近机场/高铁站" onclick="handleRadioToggle(this)">
                    <label for="loc_transport">
                        <span>近机场/高铁站</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="loc_metro" name="location_preference" value="近地铁站" onclick="handleRadioToggle(this)">
                    <label for="loc_metro">
                        <span>近地铁站</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="loc_harbour" name="location_preference" value="近维港" onclick="handleRadioToggle(this)">
                    <label for="loc_harbour">
                        <span>近维港</span>
                    </label>
                </div>
                <div class="option-card">
                    <input type="radio" id="loc_attraction" name="location_preference" value="近特色景点" onclick="handleRadioToggle(this)">
                    <label for="loc_attraction">
                        <span>近特色景点</span>
                    </label>
                </div>
            </div>
            <div style="text-align: right;">
                <button type="button" class="clear-choice-btn" onclick="clearLocationPreference()">清除第 5 题选择 (保持不选)</button>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
            提交并进入酒店预订平台
        </button>
    </form>
</div>

<script>
    // 支持单选可取消选择 (再次点击已选中的 radio 即可取消)
    let lastCheckedRadio = null;
    function handleRadioToggle(radio) {
        if (lastCheckedRadio === radio) {
            radio.checked = false;
            lastCheckedRadio = null;
        } else {
            lastCheckedRadio = radio;
        }
    }

    function clearLocationPreference() {
        document.querySelectorAll('input[name="location_preference"]').forEach(el => el.checked = false);
        lastCheckedRadio = null;
    }

    function generate32DigitParticipantID() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const timestamp14 = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

        let random18 = '';
        for (let i = 0; i < 18; i++) {
            random18 += Math.floor(Math.random() * 10);
        }
        return timestamp14 + random18;
    }

    let currentParticipantID = localStorage.getItem("participantID");
    if (!currentParticipantID || currentParticipantID.length !== 32) {
        currentParticipantID = generate32DigitParticipantID();
        localStorage.setItem("participantID", currentParticipantID);
    }

    document.addEventListener("DOMContentLoaded", () => {
        try {
            if (typeof db !== 'undefined') {
                db.ref('participants/' + currentParticipantID).update({
                    participantID: currentParticipantID,
                    createdAt: new Date().toISOString()
                });
            }
        } catch(e) {
            console.log("Firebase sync skipped in offline mode.");
        }
    });

    // Firebase 原子计数递增 (+1)
    function getNextGroupingNumber() {
        return new Promise((resolve) => {
            if (typeof db === 'undefined') {
                let fallbackNum = parseInt(localStorage.getItem('local_grouping_num') || "0", 10);
                localStorage.setItem('local_grouping_num', fallbackNum + 1);
                resolve(fallbackNum);
                return;
            }

            const groupingRef = db.ref('grouping');
            groupingRef.transaction((currentValue) => {
                return (currentValue || 0) + 1;
            }, (error, committed, snapshot) => {
                if (error || !committed) {
                    console.warn("Transaction failed, using fallback:", error);
                    resolve(Math.floor(Math.random() * 100));
                } else {
                    resolve(snapshot.val() - 1);
                }
            });
        });
    }

    async function handleSubmit(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '正在分析偏好并分配模式...';

        const formData = new FormData(event.target);

        // 收集问卷数据 (已更新为 4 个价格档位，无星级题，并新增地点特色题)
        const pricePref = formData.get("price_preference");
        const ratingPref = formData.get("rating_preference");
        const facilities = formData.getAll("hotel_facilities");
        const preferredRegion = formData.get("preferred_region");
        const locationPref = formData.get("location_preference") || "无特定偏好";

        const surveyResponses = {
            price_preference: pricePref,
            rating_preference: ratingPref,
            hotel_facilities: facilities,
            preferred_region: preferredRegion,
            location_preference: locationPref
        };

        // 获取分组编号及余数 (grouping % 4)
        const currentGroupNumber = await getNextGroupingNumber();
        const conditionModulo = currentGroupNumber % 4;

        let autonomyMode = "low";
        let recommendationMode = "traditional";

        if (conditionModulo === 0) {
            autonomyMode = "low";
            recommendationMode = "traditional";
        } else if (conditionModulo === 1) {
            autonomyMode = "low";
            recommendationMode = "ai";
        } else if (conditionModulo === 2) {
            autonomyMode = "high";
            recommendationMode = "traditional";
        } else if (conditionModulo === 3) {
            autonomyMode = "high";
            recommendationMode = "ai";
        }

        // 默认 Traditional 推荐：4 星级 Eco 酒店 (香港东隅酒店 ID: 21)
        let recommendedHotelId = 21;
        let recommendedHotelName = "香港东隅酒店 (EAST Hong Kong)";
        let aiNudgeText = "";

        if (recommendationMode === "ai") {
            try {
                // 仅筛选具有 eco 纪录的候选酒店传递给 AI
                const ecoHotels = typeof hotelsData !== 'undefined'
                    ? hotelsData.filter(h => h.eco && h.eco.trim() !== "")
                    : [];

                const payload = {
                    products: ecoHotels,
                    preferences: surveyResponses
                };

                const response = await fetch("/api/recommend", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.recommendedHotelId) recommendedHotelId = data.recommendedHotelId;
                    if (data.recommendedHotelName) recommendedHotelName = data.recommendedHotelName;
                    aiNudgeText = data.recommendation || "These items offer premium hospitality and certified eco-friendly living tailored to your stay.";
                } else {
                    throw new Error("AI service non-200");
                }
            } catch (err) {
                console.warn("AI recommendation failed, using fallback:", err);
                recommendedHotelId = 21;
                aiNudgeText = "These items feature verified green operations and refined hospitality for your ideal stay.";
            }
        } else {
            // Traditional 模式
            recommendedHotelId = 21;
            recommendedHotelName = "香港东隅酒店 (EAST Hong Kong)";
            aiNudgeText = "为您精选平台今日主推特选住宿：香港东隅酒店，尽享轻奢设计与可持续发展理念。";
        }

        // 保存状态至 localStorage
        localStorage.setItem("grouping_number", currentGroupNumber);
        localStorage.setItem("condition_modulo", conditionModulo);
        localStorage.setItem("autonomy_mode", autonomyMode);
        localStorage.setItem("recommendation_mode", recommendationMode);
        localStorage.setItem("recommended_hotel_id", recommendedHotelId);
        localStorage.setItem("recommended_hotel_name", recommendedHotelName);
        localStorage.setItem("ai_nudge_text", aiNudgeText);
        localStorage.setItem("user_preferences", JSON.stringify(surveyResponses));

        // 写入 Firebase 问卷数据节点
        const firebaseData = {
            participantID: currentParticipantID,
            groupingNumber: currentGroupNumber,
            conditionModulo: conditionModulo,
            autonomyMode: autonomyMode,
            recommendationMode: recommendationMode,
            recommendedHotelId: recommendedHotelId,
            recommendedHotelName: recommendedHotelName,
            aiNudgeText: aiNudgeText,
            submittedAt: new Date().toISOString(),
            responses: surveyResponses
        };

        try {
            if (typeof db !== 'undefined') {
                await db.ref('survey_responses/' + currentParticipantID).set(firebaseData);
            }
        } catch (dbError) {
            console.error('保存至 Firebase 失败:', dbError);
        }

        // 跳转并带上实验组态参数
        window.location.href = `booking_page.html?recId=${recommendedHotelId}&mode=${recommendationMode}&autonomy=${autonomyMode}&group=${currentGroupNumber}`;
    }
</script>
</body>
</html>
