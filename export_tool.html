<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripStay 实验数据导出与管理工具 (Master Dataset Exporter)</title>
    <!-- SheetJS 与 Firebase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // 与 booking_page / index 保持完全一致的 Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyCUVqZIgK8YKNAQkZLyA7mHq0qHbPE4RQk",
            authDomain: "online-study-3a.firebaseapp.com",
            databaseURL: "https://online-study-3a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "online-study-3a",
            storageBucket: "online-study-3a.firebasestorage.app",
            messagingSenderId: "641152608367",
            appId: "1:641152608367:web:c6a1a0920d1988d156c59a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --border: #e2e8f0;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }
        .export-card {
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            text-align: center;
            max-width: 620px;
            width: 100%;
            border: 1px solid var(--border);
        }
        .icon {
            font-size: 44px;
            margin-bottom: 12px;
        }
        h2 {
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 1.4rem;
            font-weight: 800;
        }
        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-num {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .export-btn {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }
        .export-btn:hover { background: var(--primary-hover); }
        .export-btn:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

        .refresh-btn {
            background: #ffffff;
            color: var(--text-primary);
            border: 1.5px solid var(--border);
            font-size: 14px;
            padding: 10px 16px;
        }
        .refresh-btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        /* 危险区样式 */
        .danger-zone {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1.5px dashed var(--border);
            text-align: left;
        }
        .danger-title {
            color: var(--danger);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .danger-desc {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .delete-btn {
            background: #ffffff;
            color: var(--danger);
            border: 1.5px solid #fecaca;
            font-size: 14px;
            padding: 11px 16px;
        }
        .delete-btn:hover {
            background: #fee2e2;
            border-color: var(--danger);
        }
        .delete-btn:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            border-color: #cbd5e1;
            cursor: not-allowed;
        }

        #statusMsg {
            margin-top: 18px;
            font-size: 13.5px;
            font-weight: 600;
            color: #334155;
            min-height: 20px;
            line-height: 1.5;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="export-card">
    <div class="icon">🏨📊</div>
    <h2>TripStay 实验数据导出与管理工具</h2>
    <p class="subtitle">全面支持最新 2×2 自主性与推荐干预实验架构，一键抓取并导出结构化受试者前测偏好、系统推荐干预、推荐提示语 (Nudge Text) 及预订决策数据。</p>
    
    <!-- 实时数据统计卡片 -->
    <div class="summary-stats">
        <div class="stat-item">
            <span class="stat-num" id="statParticipants">--</span>
            <span class="stat-label">已登记参与者</span>
        </div>
        <div class="stat-item">
            <span class="stat-num" id="statSurveys">--</span>
            <span class="stat-label">已提交问卷</span>
        </div>
        <div class="stat-item">
            <span class="stat-num" id="statBookings">--</span>
            <span class="stat-label">已完成预订</span>
        </div>
    </div>

    <div class="btn-group">
        <button id="exportBtn" class="btn export-btn" onclick="exportData()">
            <span>📥</span> 下载完整研究数据总表 (.xlsx)
        </button>
        <button class="btn refresh-btn" onclick="fetchLiveStats()">
            <span>🔄</span> 刷新数据库实时统计
        </button>
    </div>

    <div id="statusMsg"></div>

    <!-- 数据库重置保护区域 (双重验证) -->
    <div class="danger-zone">
        <div class="danger-title">⚠️ 危险操作区 (Danger Zone)</div>
        <div class="danger-desc">
            清空数据库将永久删除所有受试者登记记录（participants）、前测问卷结果（survey_responses）与模拟订房订单（bookings），并将递增分组编号（grouping）重置为 0。此操作完全不可逆，请在导出备份后再操作。
        </div>
        <button id="deleteBtn" class="btn delete-btn" onclick="handleClearDatabase()">
            <span>🗑️</span> 清空实验数据库 (需二次验证)
        </button>
    </div>
</div>

<script>
    // 页面载入时自动获取实时状态统计
    window.addEventListener("DOMContentLoaded", () => {
        fetchLiveStats();
    });

    async function fetchLiveStats() {
        const status = document.getElementById("statusMsg");
        try {
            const [participantsSnap, surveySnap, bookingsSnap] = await Promise.all([
                db.ref('participants').once('value'),
                db.ref('survey_responses').once('value'),
                db.ref('bookings').once('value')
            ]);

            const pCount = participantsSnap.exists() ? Object.keys(participantsSnap.val()).length : 0;
            const sCount = surveySnap.exists() ? Object.keys(surveySnap.val()).length : 0;
            const bCount = bookingsSnap.exists() ? Object.keys(bookingsSnap.val()).length : 0;

            document.getElementById("statParticipants").innerText = pCount;
            document.getElementById("statSurveys").innerText = sCount;
            document.getElementById("statBookings").innerText = bCount;

            status.innerText = `数据统计已于 ${new Date().toLocaleTimeString()} 更新完成。`;
        } catch (e) {
            console.warn("获取数据统计失败:", e);
            status.innerText = "⚠️ 无法获取实时数据统计，请检查网络连接或 Firebase 配置。";
        }
    }

    async function exportData() {
        const btn = document.getElementById("exportBtn");
        const status = document.getElementById("statusMsg");
        btn.disabled = true;
        status.innerText = "⏳ 正在连接 Firebase 并提取最新实验数据...";

        try {
            // 同步并行读取本实验的三大主要数据节点
            const [participantsSnap, surveySnap, bookingsSnap] = await Promise.all([
                db.ref('participants').once('value'),
                db.ref('survey_responses').once('value'),
                db.ref('bookings').once('value')
            ]);

            const participantsObj = participantsSnap.val() || {};
            const surveyObj = surveySnap.val() || {};
            const bookingsObj = bookingsSnap.val() || {};

            // 提取所有唯一受试者 ID (32位 Participant ID)
            const allPIDs = new Set([
                ...Object.keys(participantsObj),
                ...Object.keys(surveyObj),
                ...Object.keys(bookingsObj)
            ].filter(pid => pid && pid.trim() !== ""));

            if (allPIDs.size === 0) {
                status.innerText = "ℹ️ 数据库目前为空，未找到任何受试者数据记录。";
                btn.disabled = false;
                return;
            }

            const masterDataMap = {};

            // 基于最新问卷与主页架构精确定义分析列（包含新增的 AI_Nudge_Text）
            allPIDs.forEach(pid => {
                masterDataMap[pid] = {
                    // 1. 受试者标识
                    "Participant_ID": pid,
                    "Registration_Time": "",

                    // 2. 实验分组与自变量 (2x2 Design)
                    "Grouping_Number": "",
                    "Grouping_Modulo_4": "",     // 0: Low-Trad, 1: Low-AI, 2: High-Trad, 3: High-AI
                    "Autonomy_Mode": "",         // 'low' | 'high'
                    "Recommendation_Mode": "",   // 'traditional' | 'ai'

                    // 3. 最新前测问卷各题回答 (index_2.html 架构)
                    "Survey_Q1_Budget_Preference": "",       // 经济 / 精致 / 高级 / 奢侈
                    "Survey_Q2_Rating_Preference": "",       // 8.0分以上 / 8.5分以上 / 9.0分以上 / 9.5分顶尖
                    "Survey_Q3_Facilities_Preference": "",   // 多选设施 (早餐/独立卫浴/泳池/取消/健身/机场接送/泊车)
                    "Survey_Q4_Region_Preference": "",       // 港岛 / 九龙 / 新界
                    "Survey_Q5_Location_Feature": "",        // 近机场/高铁站 / 近地铁站 / 近维港 / 近特色景点 / 无特定偏好
                    "Survey_Submitted_At": "",

                    // 4. 推荐系统干预内容（含 Nudge Text）
                    "System_Recommended_Hotel_ID": "",
                    "System_Recommended_Hotel_Name": "",
                    "AI_Nudge_Text": "",                     // 记录系统推荐提示语

                    // 5. 酒店预订决策与结果 (核心因变量)
                    "Has_Completed_Booking": "No",
                    "Selected_Hotel_ID": "",
                    "Selected_Hotel_Name": "",
                    "Selected_Hotel_Region": "",
                    "Is_Recommended_Hotel_Chosen": "",       // 关键因变量：Yes / No
                    "Total_Paid_Amount": "",
                    "Booking_Created_At": ""
                };
            });

            // 填充 1: participants 节点登记时间
            Object.entries(participantsObj).forEach(([pid, data]) => {
                if (masterDataMap[pid]) {
                    masterDataMap[pid]["Registration_Time"] = data.createdAt || "";
                }
            });

            // 填充 2: survey_responses 节点（前测问卷、推荐酒店及 Nudge Text）
            Object.entries(surveyObj).forEach(([pid, data]) => {
                if (masterDataMap[pid]) {
                    masterDataMap[pid]["Grouping_Number"] = data.groupingNumber !== undefined ? data.groupingNumber : "";
                    masterDataMap[pid]["Grouping_Modulo_4"] = data.conditionModulo !== undefined ? data.conditionModulo : "";
                    masterDataMap[pid]["Autonomy_Mode"] = data.autonomyMode || "";
                    masterDataMap[pid]["Recommendation_Mode"] = data.recommendationMode || "";

                    masterDataMap[pid]["System_Recommended_Hotel_ID"] = data.recommendedHotelId || "";
                    masterDataMap[pid]["System_Recommended_Hotel_Name"] = data.recommendedHotelName || "";
                    masterDataMap[pid]["AI_Nudge_Text"] = data.aiNudgeText || "";
                    masterDataMap[pid]["Survey_Submitted_At"] = data.submittedAt || "";

                    if (data.responses) {
                        masterDataMap[pid]["Survey_Q1_Budget_Preference"] = data.responses.price_preference || "";
                        masterDataMap[pid]["Survey_Q2_Rating_Preference"] = data.responses.rating_preference || "";

                        // 多选设施以管道符拼接
                        if (Array.isArray(data.responses.hotel_facilities)) {
                            masterDataMap[pid]["Survey_Q3_Facilities_Preference"] = data.responses.hotel_facilities.join(" | ");
                        } else {
                            masterDataMap[pid]["Survey_Q3_Facilities_Preference"] = data.responses.hotel_facilities || "";
                        }

                        masterDataMap[pid]["Survey_Q4_Region_Preference"] = data.responses.preferred_region || "";
                        masterDataMap[pid]["Survey_Q5_Location_Feature"] = data.responses.location_preference || "";
                    }
                }
            });

            // 填充 3: bookings 节点（模拟订房决策数据）
            Object.entries(bookingsObj).forEach(([key, data]) => {
                const pid = data.participantID || key;
                if (masterDataMap[pid]) {
                    masterDataMap[pid]["Has_Completed_Booking"] = "Yes";
                    masterDataMap[pid]["Autonomy_Mode"] = data.autonomyMode || masterDataMap[pid]["Autonomy_Mode"];
                    masterDataMap[pid]["Recommendation_Mode"] = data.recommendationMode || masterDataMap[pid]["Recommendation_Mode"];
                    
                    masterDataMap[pid]["Selected_Hotel_ID"] = data.hotelId || "";
                    masterDataMap[pid]["Selected_Hotel_Name"] = data.hotelName || "";
                    masterDataMap[pid]["Selected_Hotel_Region"] = data.hotelRegion || "";
                    
                    // 补充可能保存在 bookings 中的 nudge text
                    if (!masterDataMap[pid]["AI_Nudge_Text"] && data.aiNudgeText) {
                        masterDataMap[pid]["AI_Nudge_Text"] = data.aiNudgeText;
                    }

                    // 核心因变量判断
                    if (data.isRecommendedHotelChosen !== undefined) {
                        masterDataMap[pid]["Is_Recommended_Hotel_Chosen"] = data.isRecommendedHotelChosen ? "Yes" : "No";
                    } else if (masterDataMap[pid]["System_Recommended_Hotel_ID"]) {
                        masterDataMap[pid]["Is_Recommended_Hotel_Chosen"] = (String(data.hotelId) === String(masterDataMap[pid]["System_Recommended_Hotel_ID"])) ? "Yes" : "No";
                    }

                    masterDataMap[pid]["Total_Paid_Amount"] = data.totalPaid || "";
                    masterDataMap[pid]["Booking_Created_At"] = data.createdAt || "";
                }
            });

            // 使用 SheetJS 生成多工作表 Excel 档案
            const wb = XLSX.utils.book_new();

            // 工作表 1：全量主数据表 (Master_Dataset)
            const masterRows = Object.values(masterDataMap);
            const wsMaster = XLSX.utils.json_to_sheet(masterRows);

            // 设定对应列宽
            wsMaster['!cols'] = [
                { wch: 34 }, // Participant_ID
                { wch: 22 }, // Registration_Time
                { wch: 16 }, // Grouping_Number
                { wch: 18 }, // Grouping_Modulo_4
                { wch: 15 }, // Autonomy_Mode
                { wch: 22 }, // Recommendation_Mode
                { wch: 24 }, // Survey_Q1_Budget_Preference
                { wch: 24 }, // Survey_Q2_Rating_Preference
                { wch: 36 }, // Survey_Q3_Facilities_Preference
                { wch: 22 }, // Survey_Q4_Region_Preference
                { wch: 22 }, // Survey_Q5_Location_Feature
                { wch: 22 }, // Survey_Submitted_At
                { wch: 28 }, // System_Recommended_Hotel_ID
                { wch: 32 }, // System_Recommended_Hotel_Name
                { wch: 46 }, // AI_Nudge_Text
                { wch: 22 }, // Has_Completed_Booking
                { wch: 18 }, // Selected_Hotel_ID
                { wch: 32 }, // Selected_Hotel_Name
                { wch: 18 }, // Selected_Hotel_Region
                { wch: 28 }, // Is_Recommended_Hotel_Chosen
                { wch: 16 }, // Total_Paid_Amount
                { wch: 22 }  // Booking_Created_At
            ];
            XLSX.utils.book_append_sheet(wb, wsMaster, "Master_Dataset");

            // 工作表 2：统计摘要 (Condition_Summary)
            const conditionSummary = [
                { "Condition_Modulo": 0, "Autonomy": "Low",  "Recommendation": "Traditional", "Total_Participants": 0, "Completed_Bookings": 0, "Recommended_Chosen_Count": 0, "Adoption_Rate": "0%" },
                { "Condition_Modulo": 1, "Autonomy": "Low",  "Recommendation": "AI",          "Total_Participants": 0, "Completed_Bookings": 0, "Recommended_Chosen_Count": 0, "Adoption_Rate": "0%" },
                { "Condition_Modulo": 2, "Autonomy": "High", "Recommendation": "Traditional", "Total_Participants": 0, "Completed_Bookings": 0, "Recommended_Chosen_Count": 0, "Adoption_Rate": "0%" },
                { "Condition_Modulo": 3, "Autonomy": "High", "Recommendation": "AI",          "Total_Participants": 0, "Completed_Bookings": 0, "Recommended_Chosen_Count": 0, "Adoption_Rate": "0%" }
            ];

            masterRows.forEach(row => {
                const mod = parseInt(row["Grouping_Modulo_4"]);
                if (!isNaN(mod) && conditionSummary[mod]) {
                    conditionSummary[mod]["Total_Participants"]++;
                    if (row["Has_Completed_Booking"] === "Yes") {
                        conditionSummary[mod]["Completed_Bookings"]++;
                        if (row["Is_Recommended_Hotel_Chosen"] === "Yes") {
                            conditionSummary[mod]["Recommended_Chosen_Count"]++;
                        }
                    }
                }
            });

            conditionSummary.forEach(c => {
                c["Adoption_Rate"] = c["Completed_Bookings"] > 0
                    ? ((c["Recommended_Chosen_Count"] / c["Completed_Bookings"]) * 100).toFixed(1) + "%"
                    : "0%";
            });

            const wsSummary = XLSX.utils.json_to_sheet(conditionSummary);
            wsSummary['!cols'] = [
                { wch: 18 }, { wch: 14 }, { wch: 18 }, { wch: 18 }, { wch: 20 }, { wch: 26 }, { wch: 16 }
            ];
            XLSX.utils.book_append_sheet(wb, wsSummary, "Condition_Summary");

            const today = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `TripStay_Experiment_Master_${today}.xlsx`);

            status.innerText = `✅ 导出成功！`;
            fetchLiveStats();
        } catch (err) {
            console.error("Export Error:", err);
            status.innerText = "❌ 导出失败，请检查网络连接或按 F12 打开开发者控制台查看报错日志。";
        } finally {
            btn.disabled = false;
        }
    }

    // 清空数据库逻辑（双重确认安全保护）
    async function handleClearDatabase() {
        const deleteBtn = document.getElementById("deleteBtn");
        const status = document.getElementById("statusMsg");

        // 第一层保护确认
        const firstConfirm = confirm("⚠️ 警告：您确定要彻底清空 Firebase 数据库中的所有实验记录吗？\n\n此操作将永久删除所有受试者登记、问卷答案与订房记录！");
        if (!firstConfirm) return;

        // 第二层保护：文本输入验证
        const VERIFICATION_CODE = "DELETE-ALL-DATA";
        const userInput = prompt(`🔴 高危操作：为防止误删数据，请输入精确验证码确认执行：\n\n请输入：${VERIFICATION_CODE}`);

        if (userInput !== VERIFICATION_CODE) {
            alert("❌ 验证码输入不正确，操作已安全取消。数据库未作任何更改。");
            return;
        }

        deleteBtn.disabled = true;
        status.innerText = "⏳ 正在清空数据库实验数据与重置计数器...";

        try {
            // 执行原子批量清除并重置分组计数器
            const updates = {
                'participants': null,
                'survey_responses': null,
                'bookings': null,
                'grouping': 0 // 重置分组递增计数
            };

            await db.ref().update(updates);

            status.innerText = "🗑️ 数据库已彻底清空，实验分组序号已重置为 0。";
            alert("✅ 数据库清空成功！可以开始新一批次的受试者实验。");
            fetchLiveStats();
        } catch (err) {
            console.error("Clear DB Error:", err);
            status.innerText = `❌ 清空数据库失败: ${err.message}`;
            alert(`清空失败: ${err.message}`);
        } finally {
            deleteBtn.disabled = false;
        }
    }
</script>
</body>
</html>
