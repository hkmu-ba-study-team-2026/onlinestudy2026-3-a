    <style>

        body {

            color: #1e293b;

        .header-section h1 {

        .stat-banner {

<body>

<div class="main-card">
    <div class="header-section">
        <h1><i class="fa-solid fa-hotel" style="color:var(--accent);"></i> TripStay 實驗數據導出與管理平台</h1>
    </div>

    <!-- 即時指標卡 -->
    <div class="stat-banner">
        <div class="stat-item">
            <h4>當前 Grouping 計數</h4>
            <div class="val" id="statGrouping">--</div>
        </div>
        <div class="stat-item">
            <h4>問卷提交樣本數</h4>
            <div class="val" id="statSurveys">--</div>
        </div>
        <div class="stat-item">
            <h4>完成預訂樣本數</h4>
            <div class="val" id="statBookings">--</div>
        </div>
    </div>

    <div class="action-box">
        <button id="exportBtn" class="btn btn-export" onclick="exportMasterData()">
            <i class="fa-solid fa-file-excel"></i> 下載完整研究數據
        </button>
        <button class="btn btn-refresh" onclick="fetchLiveStats()">
            <i class="fa-solid fa-arrows-rotate"></i> 刷新實時統計
        </button>
    </div>

    <!-- 管理員高危清空區域 (安全短語驗證保護) -->
    <div class="admin-danger-zone">
        <div class="danger-title">
            <i class="fa-solid fa-triangle-exclamation"></i> 實驗重置與數據清空
        </div>
        <div class="danger-desc">
            此操作將永久抹除資料庫中的記錄，並將 <code>grouping</code> 變量徹底重置歸零為 0。操作前需輸入安全校驗短語。
        </div>
        <button id="resetBtn" class="btn btn-danger" onclick="handleSecureReset()">
            <i class="fa-solid fa-trash-can"></i> 重置資料庫
        </button>
    </div>

    <div id="statusMsg"></div>
</div>

<script>
    const REQUIRED_CONFIRM_PHRASE = "DELETE-DATABASE";

    // 依據酒店 ID 提取真實資料集細節 (含兩文三語)
    function getHotelDetailsById(id) {
        if (typeof hotelsData !== 'undefined' && Array.isArray(hotelsData)) {
            const found = hotelsData.find(h => h.id === parseInt(id, 10));
            if (found) {
                return {
                    name_zh_tw: (found.i18n && found.i18n["zh-TW"] && found.i18n["zh-TW"].name) || found.name,
                    name_zh_cn: (found.i18n && found.i18n["zh-CN"] && found.i18n["zh-CN"].name) || found.name,
                    name_en: found.enName || (found.i18n && found.i18n["en"] && found.i18n["en"].name) || found.name,
                    region: found.region,
                    stars: found.stars,
                    hasEco: (found.eco && found.eco.trim() !== "") ? "Yes" : "No",
                    ecoDetails: found.eco || ""
                };
            }
        }
        return { name_zh_tw: `酒店ID #${id}`, name_zh_cn: `酒店ID #${id}`, name_en: `Hotel #${id}`, region: "", stars: "", hasEco: "No", ecoDetails: "" };
    }

    async function fetchLiveStats() {
        if (typeof db === 'undefined') return;
        try {
            const [groupSnap, surveySnap, bookSnap] = await Promise.all([
                db.ref('grouping').once('value'),
                db.ref('survey_responses').once('value'),
                db.ref('bookings').once('value')
            ]);
            document.getElementById("statGrouping").innerText = groupSnap.val() !== null ? groupSnap.val() : 0;
            document.getElementById("statSurveys").innerText = surveySnap.val() ? Object.keys(surveySnap.val()).length : 0;
            document.getElementById("statBookings").innerText = bookSnap.val() ? Object.keys(bookSnap.val()).length : 0;
            showStatus(`數據統計已於 ${new Date().toLocaleTimeString()} 刷新完成。`, "info");
        } catch(e) {
            console.warn("讀取統計信息失敗:", e);
            showStatus("⚠️ 無法獲取即時統計數據，請檢查網絡連接或 Firebase 配置。", "error");
        }
    }

    function showStatus(text, type = "info") {
        const el = document.getElementById("statusMsg");
        el.className = `status-${type}`;
        el.innerHTML = text;
        el.style.display = "block";
    }

    // ==========================================
    // 導出數據：Sheet 1 (Master_Dataset) + Sheet 2 (Condition_Summary)
    // ==========================================
    async function exportMasterData() {
        const btn = document.getElementById("exportBtn");
        btn.disabled = true;
        showStatus("<i class='fa-solid fa-spinner fa-spin'></i> 正在讀取 Firebase 資料庫並提取實驗數據...", "info");

        try {
            const [groupSnap, partSnap, surveySnap, bookingsSnap] = await Promise.all([
                db.ref('grouping').once('value'),
                db.ref('participants').once('value'),
                db.ref('survey_responses').once('value'),
                db.ref('bookings').once('value')
            ]);

            const currentGroupingCounter = groupSnap.val() !== null ? groupSnap.val() : 0;
            const participantsObj = partSnap.val() || {};
            const surveyObj = surveySnap.val() || {};
            const bookingsObj = bookingsSnap.val() || {};

            const surveys = Object.values(surveyObj);
            const bookings = Object.values(bookingsObj);

            // 搜集所有唯一 32 位受試者 Participant ID
            const allPIDs = new Set([
                ...Object.keys(participantsObj),
                ...surveys.map(s => s.participantID),
                ...bookings.map(b => b.participantID)
            ].filter(pid => pid && String(pid).trim() !== ""));

            if (allPIDs.size === 0) {
                showStatus("ℹ️ 資料庫目前為空，未找到任何受試者數據記錄。", "info");
                btn.disabled = false;
                return;
            }

            const masterDataMap = {};

            // 定義 Sheet 1: Master_Dataset 每行完整結構 (含兩文三語 Nudge 與 7 點李克特量表)
            allPIDs.forEach(pid => {
                masterDataMap[pid] = {
                    // 1. 受試者基本資訊與語言
                    "Participant_ID": pid,
                    "Participant_Language": "",
                    "Registration_Time": "",

                    // 2. 實驗組別與自變量 (2x2 Design)
                    "Grouping_Number": "",
                    "Grouping_Modulo_4": "",
                    "Autonomy_Mode": "",
                    "Recommendation_Mode": "",
                    "Condition_Label": "",

                    // 3. 時間與問卷時長分析
                    "Survey_Entry_Time": "",
                    "Survey_Submitted_At": "",
                    "Survey_Duration_Seconds": "",

                    // 4. 前測問卷各題偏好 (Q1 ~ Q8)
                    "Survey_Q1_Budget_Preference": "",
                    "Survey_Q2_Rating_Preference": "",
                    "Survey_Q3_Facilities_Preference": "",
                    "Survey_Q4_Region_Preference": "",
                    "Survey_Q5_Location_Feature": "",
                    "Survey_Q6_Friendly_Courteous": "",
                    "Survey_Q7_Polite_Considerate": "",
                    "Survey_Q8_Admit_Mistakes_Difficult": "",

                    // 5. 推薦系統介入內容與兩文三語 Nudge Text
                    "System_Recommended_Hotel_ID": "",
                    "System_Recommended_Hotel_Name_ZH_TW": "",
                    "System_Recommended_Hotel_Name_ZH_CN": "",
                    "System_Recommended_Hotel_Name_EN": "",
                    "System_Recommended_Hotel_Has_Eco": "",
                    "AI_Nudge_Text_ZH_TW": "",
                    "AI_Nudge_Text_ZH_CN": "",
                    "AI_Nudge_Text_EN": "",
                    "AI_Nudge_Text_Active": "",

                    // 6. 最終酒店預訂決策 (核心因變量)
                    "Has_Completed_Booking": "No",
                    "Selected_Hotel_ID": "",
                    "Selected_Hotel_Name": "",
                    "Selected_Hotel_Region": "",
                    "Selected_Room_Name": "",
                    "Selected_Room_Size": "",
                    "Selected_Room_Bathroom": "",
                    "Selected_Room_Breakfast": "",
                    "Total_Paid_Amount": "",
                    "Is_Recommended_Hotel_Chosen": "No",
                    "Booking_Confirmed_At": "",
                };
            });

            // 填充 1: participants 節點
            Object.entries(participantsObj).forEach(([pid, data]) => {
                if (masterDataMap[pid]) {
                    masterDataMap[pid]["Registration_Time"] = data.createdAt || "";
                }
            });

            // 填充 2: survey_responses 節點
            surveys.forEach(s => {
                const pid = s.participantID;
                if (masterDataMap[pid]) {
                    const row = masterDataMap[pid];
                    const entryTime = s.entryAt || row["Registration_Time"] || "";
                    const submitTime = s.submittedAt || "";

                    row["Survey_Entry_Time"] = entryTime;
                    row["Survey_Submitted_At"] = submitTime;

                    if (entryTime && submitTime) {
                        const diffMs = new Date(submitTime) - new Date(entryTime);
                        row["Survey_Duration_Seconds"] = Math.max(0, Math.round(diffMs / 1000));
                    }

                    row["Grouping_Number"] = s.groupingNumber !== undefined ? s.groupingNumber : "";
                    const mod = s.conditionModulo !== undefined ? s.conditionModulo : (s.groupingNumber !== undefined ? (s.groupingNumber % 4) : "");
                    row["Grouping_Modulo_4"] = mod;

                    const groupConditions = [
                        "Group 0 (Low Autonomy + Traditional)",
                        "Group 1 (Low Autonomy + AI Nudge)",
                        "Group 2 (High Autonomy + Traditional)",
                        "Group 3 (High Autonomy + AI Nudge)"
                    ];
                    row["Condition_Label"] = groupConditions[mod] || `Group ${mod}`;
                    row["Autonomy_Mode"] = s.autonomyMode || (mod === 0 || mod === 1 ? "low" : "high");
                    row["Recommendation_Mode"] = s.recommendationMode || (mod === 0 || mod === 2 ? "traditional" : "ai");

                    if (s.responses) {
                        row["Survey_Q1_Budget_Preference"] = s.responses.price_preference || "";
                        row["Survey_Q2_Rating_Preference"] = s.responses.rating_preference || "";
                        row["Survey_Q3_Facilities_Preference"] = Array.isArray(s.responses.hotel_facilities)
                            ? s.responses.hotel_facilities.join(" | ")
                            : (s.responses.hotel_facilities || "");
                        row["Survey_Q4_Region_Preference"] = s.responses.preferred_region || "";
                        row["Survey_Q5_Location_Feature"] = s.responses.location_preference || "";
                        row["Survey_Q6_Friendly_Courteous"] = s.responses.q6_friendly_courteous || "";
                        row["Survey_Q7_Polite_Considerate"] = s.responses.q7_polite_considerate || "";
                        row["Survey_Q8_Admit_Mistakes_Difficult"] = s.responses.q8_admit_mistakes_difficult || "";
                    }

                    // 推薦酒店 ID 與酒店三語名稱
                    const recId = s.recommendedHotelId;
                    row["System_Recommended_Hotel_ID"] = recId || "";
                    const hotelDetails = getHotelDetailsById(recId);
                    row["System_Recommended_Hotel_Has_Eco"] = hotelDetails.hasEco;

                    if (s.recommendedHotelName && typeof s.recommendedHotelName === "object") {
                        row["System_Recommended_Hotel_Name_ZH_TW"] = s.recommendedHotelName["zh-TW"] || hotelDetails.name_zh_tw;
                        row["System_Recommended_Hotel_Name_ZH_CN"] = s.recommendedHotelName["zh-CN"] || hotelDetails.name_zh_cn;
                        row["System_Recommended_Hotel_Name_EN"] = s.recommendedHotelName["en"] || hotelDetails.name_en;
                    } else {
                        row["System_Recommended_Hotel_Name_ZH_TW"] = hotelDetails.name_zh_tw;
                        row["System_Recommended_Hotel_Name_ZH_CN"] = s.recommendedHotelName || hotelDetails.name_zh_cn;
                        row["System_Recommended_Hotel_Name_EN"] = hotelDetails.name_en;
                    }

                    // 處理兩文三語 Nudge Text
                    if (s.aiNudgeText && typeof s.aiNudgeText === "object") {
                        row["AI_Nudge_Text_ZH_TW"] = s.aiNudgeText["zh-TW"] || "";
                        row["AI_Nudge_Text_ZH_CN"] = s.aiNudgeText["zh-CN"] || "";
                        row["AI_Nudge_Text_EN"] = s.aiNudgeText["en"] || "";
                        row["AI_Nudge_Text_Active"] = s.aiNudgeText["zh-CN"] || s.aiNudgeText["zh-TW"] || s.aiNudgeText["en"] || "";
                    } else if (typeof s.aiNudgeText === "string") {
                        row["AI_Nudge_Text_Active"] = s.aiNudgeText;
                        row["AI_Nudge_Text_ZH_CN"] = s.aiNudgeText;
                    }
                }
            });

            // 填充 3: bookings 節點
            bookings.forEach(b => {
                const pid = b.participantID;
                if (masterDataMap[pid]) {
                    const row = masterDataMap[pid];
                    row["Has_Completed_Booking"] = "Yes";
                    row["Selected_Hotel_ID"] = b.hotelId || "";
                    row["Selected_Hotel_Name"] = b.hotelName || "";
                    row["Selected_Hotel_Region"] = b.hotelRegion || "";
                    row["Selected_Room_Name"] = b.roomName || "";
                    row["Selected_Room_Size"] = b.roomSize || "";
                    row["Selected_Room_Bathroom"] = b.bathroom || "";
                    row["Selected_Room_Breakfast"] = b.breakfast || "";
                    row["Total_Paid_Amount"] = b.totalPaid || "";
                    row["Booking_Confirmed_At"] = b.createdAt || "";

                    if (b.selectedLanguage) {
                        row["Participant_Language"] = b.selectedLanguage;
                    }

                    // 關鍵因變量判斷
                    if (b.isRecommendedHotelChosen !== undefined) {
                        row["Is_Recommended_Hotel_Chosen"] = b.isRecommendedHotelChosen ? "Yes" : "No";
                    } else if (row["System_Recommended_Hotel_ID"]) {
                        row["Is_Recommended_Hotel_Chosen"] = (String(b.hotelId) === String(row["System_Recommended_Hotel_ID"])) ? "Yes" : "No";
                    }

                    if (!row["AI_Nudge_Text_Active"] && b.aiNudgeText) {
                        row["AI_Nudge_Text_Active"] = b.aiNudgeText;
                    }
                }
            });

            const rowsArray = Object.values(masterDataMap);

            // ==========================================
            // 建立 Sheet 2: Condition_Summary 分組統計總表
            // ==========================================
            const conditionsConfig = [
                { groupIndex: 0, label: "Group 0: Low Autonomy + Traditional", autonomy: "Low", rec: "Traditional" },
                { groupIndex: 1, label: "Group 1: Low Autonomy + AI Nudge", autonomy: "Low", rec: "AI" },
                { groupIndex: 2, label: "Group 2: High Autonomy + Traditional", autonomy: "High", rec: "Traditional" },
                { groupIndex: 3, label: "Group 3: High Autonomy + AI Nudge", autonomy: "High", rec: "AI" }
            ];

            const summaryRows = conditionsConfig.map(cond => {
                const groupRows = rowsArray.filter(r => Number(r.Grouping_Modulo_4) === cond.groupIndex);
                const totalAssigned = groupRows.length;
                const surveyCompleted = groupRows.filter(r => r.Survey_Submitted_At && r.Survey_Submitted_At.trim() !== "").length;
                const bookingCompleted = groupRows.filter(r => r.Has_Completed_Booking === "Yes").length;
                const bookingRate = surveyCompleted > 0 ? ((bookingCompleted / surveyCompleted) * 100).toFixed(1) + "%" : "0.0%";

                const recAdoptedCount = groupRows.filter(r => r.Is_Recommended_Hotel_Chosen === "Yes").length;
                const adoptionRateOfBookers = bookingCompleted > 0 ? ((recAdoptedCount / bookingCompleted) * 100).toFixed(1) + "%" : "0.0%";
                const adoptionRateOfTotal = surveyCompleted > 0 ? ((recAdoptedCount / surveyCompleted) * 100).toFixed(1) + "%" : "0.0%";

                const amounts = groupRows
                    .filter(r => r.Has_Completed_Booking === "Yes" && r.Total_Paid_Amount)
                    .map(r => {
                        const num = parseFloat(String(r.Total_Paid_Amount).replace(/[^0-9.]/g, ""));
                        return isNaN(num) ? 0 : num;
                    })
                    .filter(num => num > 0);

                const avgAmount = amounts.length > 0 ? (amounts.reduce((a, b) => a + b, 0) / amounts.length).toFixed(0) : "N/A";

                return {
                    "Condition": cond.label,
                    "Grouping_Modulo": cond.groupIndex,
                    "Autonomy_Mode": cond.autonomy,
                    "Recommendation_Mode": cond.rec,
                    "Total_Participants": totalAssigned,
                    "Survey_Completed": surveyCompleted,
                    "Booking_Completed": bookingCompleted,
                    "Booking_Conversion_Rate": bookingRate,
                    "Adopted_Rec_Count": recAdoptedCount,
                    "Rec_Adoption_Rate_of_Bookers": adoptionRateOfBookers,
                    "Rec_Adoption_Rate_of_All_Surveys": adoptionRateOfTotal,
                    "Avg_Booking_Amount_HK$": avgAmount
                };
            });

            // 添加 Total 綜合行
            const totalSurvey = rowsArray.filter(r => r.Survey_Submitted_At && r.Survey_Submitted_At.trim() !== "").length;
            const totalBook = rowsArray.filter(r => r.Has_Completed_Booking === "Yes").length;
            const totalAdopt = rowsArray.filter(r => r.Is_Recommended_Hotel_Chosen === "Yes").length;
            const allAmounts = rowsArray
                .filter(r => r.Has_Completed_Booking === "Yes" && r.Total_Paid_Amount)
                .map(r => {
                    const num = parseFloat(String(r.Total_Paid_Amount).replace(/[^0-9.]/g, ""));
                    return isNaN(num) ? 0 : num;
                })
                .filter(num => num > 0);
            const overallAvgAmount = allAmounts.length > 0 ? (allAmounts.reduce((a, b) => a + b, 0) / allAmounts.length).toFixed(0) : "N/A";

            summaryRows.push({
                "Condition": "Overall Total",
                "Grouping_Modulo": "ALL",
                "Autonomy_Mode": "Mixed",
                "Recommendation_Mode": "Mixed",
                "Total_Participants": rowsArray.length,
                "Survey_Completed": totalSurvey,
                "Booking_Completed": totalBook,
                "Booking_Conversion_Rate": totalSurvey > 0 ? ((totalBook / totalSurvey) * 100).toFixed(1) + "%" : "0.0%",
                "Adopted_Rec_Count": totalAdopt,
                "Rec_Adoption_Rate_of_Bookers": totalBook > 0 ? ((totalAdopt / totalBook) * 100).toFixed(1) + "%" : "0.0%",
                "Rec_Adoption_Rate_of_All_Surveys": totalSurvey > 0 ? ((totalAdopt / totalSurvey) * 100).toFixed(1) + "%" : "0.0%",
                "Avg_Booking_Amount_HK$": overallAvgAmount
            });

            // 建立多工作表工作簿
            const wb = XLSX.utils.book_new();

            // Sheet 1: Master_Dataset
            const wsMaster = XLSX.utils.json_to_sheet(rowsArray);
            wsMaster['!cols'] = [
                { wch: 34 }, { wch: 20 }, { wch: 22 },
                { wch: 16 }, { wch: 18 }, { wch: 15 }, { wch: 22 }, { wch: 36 },
                { wch: 24 }, { wch: 24 }, { wch: 22 },
                { wch: 26 }, { wch: 26 }, { wch: 36 }, { wch: 22 }, { wch: 22 },
                { wch: 26 }, { wch: 26 }, { wch: 30 },
                { wch: 28 }, { wch: 32 }, { wch: 32 }, { wch: 32 }, { wch: 24 },
                { wch: 40 }, { wch: 40 }, { wch: 40 }, { wch: 40 },
                { wch: 22 }, { wch: 18 }, { wch: 18 }, { wch: 32 }, { wch: 18 },
                { wch: 28 }, { wch: 18 }, { wch: 24 }, { wch: 24 }, { wch: 18 }, { wch: 26 }, { wch: 24 },
                { wch: 18 }, { wch: 28 }, { wch: 18 }
            ];
            XLSX.utils.book_append_sheet(wb, wsMaster, "Master_Dataset");

            // Sheet 2: Condition_Summary
            const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
            wsSummary['!cols'] = [
                { wch: 36 }, { wch: 18 }, { wch: 16 }, { wch: 22 },
                { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 24 },
                { wch: 18 }, { wch: 28 }, { wch: 32 }, { wch: 24 }
            ];
            XLSX.utils.book_append_sheet(wb, wsSummary, "Condition_Summary");

            const today = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
            XLSX.writeFile(wb, `TripStay_Experiment_Master_${today}.xlsx`);

            showStatus(`✅ 導出成功！已包含兩文三語 Nudge Text、作答時長與 <strong>Condition_Summary</strong> 統計總表（共 ${rowsArray.length} 行被試數據）。當前 Grouping 累計值為: <strong>${currentGroupingCounter}</strong>`, "success");
            fetchLiveStats();
        } catch (err) {
            console.error("Export Error:", err);
            showStatus(`❌ 導出失敗: ${err.message}`, "error");
        } finally {
            btn.disabled = false;
        }
    }

    // 清空資料庫邏輯（安全短語雙重驗證保護）
    async function handleSecureReset() {
        const promptMsg = `⚠️【高危操作警告】\n\n此操作將永久抹除資料庫中的所有被試記錄、問卷答卷與預訂訂單，並將 grouping 重置為 0！\n\n如確認執行，請在下方輸入框精確輸入提示短語：\n${REQUIRED_CONFIRM_PHRASE}`;
        const userInput = prompt(promptMsg);

        if (userInput === null) return;

        if (userInput.trim() !== REQUIRED_CONFIRM_PHRASE) {
            alert(`輸入錯誤！您輸入的短語不匹配，操作已安全取消。\n要求短語為: ${REQUIRED_CONFIRM_PHRASE}`);
            return;
        }

        const resetBtn = document.getElementById("resetBtn");
        resetBtn.disabled = true;
        showStatus("<i class='fa-solid fa-spinner fa-spin'></i> 正在清空節點並將 grouping 計數歸零...", "info");

        try {
            await Promise.all([
                db.ref('participants').remove(),
                db.ref('survey_responses').remove(),
                db.ref('bookings').remove(),
                db.ref('grouping').set(0)
            ]);

            showStatus("🎉 資料庫重置完畢！所有受試者數據已清空，<code>grouping</code> 變量已重置歸零為 <strong>0</strong>。", "success");
            alert("重置完成！grouping 計數器已歸零為 0。");
            fetchLiveStats();
        } catch (err) {
            console.error("Reset Failed:", err);
            showStatus(`❌ 重置失敗: ${err.message}`, "error");
        } finally {
            resetBtn.disabled = false;
        }
    }

    window.addEventListener("DOMContentLoaded", fetchLiveStats);
</script>
</body>
</html>
